# Checks every pull request and every push to main with the same tools a
# developer runs (CONTRIBUTING.md#ci).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages (gitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The version the commit-msg hook runs locally.
      - run: pip install gitlint==0.19.1
      - name: Lint the pull request's commits
        run: gitlint --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  tests:
    name: Tests and shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # python3 and shellcheck are preinstalled on the runner.
      - run: scripts/test.sh

  # The first run builds the vcpkg dependencies; later runs restore them from
  # the cache the setup action keeps.
  cross-build:
    name: Cross build of the consumer project
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          source-dir: tests/consumer
      - run: REQUIRE_CROSS_BUILD=1 python3 -m unittest tests.test_consumer -v
